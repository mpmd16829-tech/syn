<title>SMRS — Prototype congrès</title>
<style>
/* ===== Variables ===== */
:root{--bl:#13407a;--bl2:#1d5aa8;--gr:#1f9d6b;--bg:#f2f6fa;--card:#fff;--tx:#1c2733;--mu:#667585;--bd:#dde5ee;--wa:#c0392b;--or:#d98a00}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
/* ===== Navigation ===== */
nav{width:250px;background:var(--bl);color:#fff;padding:16px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.logo{border:2px dashed #ffffff80;border-radius:10px;padding:10px;text-align:center;font-size:12px;margin-bottom:10px}
nav h1{font-size:14px;margin:6px 0;line-height:1.4}
nav .ar{font-size:15px;opacity:.9}
nav button.m{display:block;width:100%;text-align:start;background:none;border:0;color:#fff;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;margin:2px 0}
nav button.m:hover,nav button.m.on{background:#ffffff22}
nav button.m.on{box-shadow:inset 3px 0 var(--gr)}
.lang{margin-top:10px;width:100%;padding:8px;border-radius:8px;border:0;background:var(--gr);color:#fff;cursor:pointer}
main{flex:1;padding:20px;min-width:0}
.banner{background:#fff4d6;border:1px solid #f0d98a;color:#6b5200;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
.slogan{color:var(--gr);font-weight:600;margin:0 0 14px}
h2{margin:0 0 12px;color:var(--bl)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.stat b{display:block;font-size:28px;color:var(--bl)}
.stat span{font-size:13px;color:var(--mu)}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.bar i{display:block;height:16px;border-radius:4px;background:linear-gradient(90deg,var(--bl2),var(--gr));min-width:2px}
.bar .l{width:150px;flex-shrink:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input,select,textarea{padding:8px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff}
button.b{padding:8px 14px;border:0;border-radius:8px;background:var(--bl2);color:#fff;cursor:pointer;font:inherit}
button.b.g{background:var(--gr)} button.b.r{background:var(--wa)} button.b.o{background:#e8eef5;color:var(--bl)}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:start;vertical-align:top}
th{background:#eaf1f8;color:var(--bl);cursor:pointer;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;margin:1px;background:#fde8e6;color:var(--wa)}
.tag.w{background:#fff1d1;color:var(--or)}
.s-Confirmé{background:#dff5ea} .s-Àcorriger{background:#fdeceb}
.pg{display:flex;gap:8px;align-items:center;margin:10px 0}
.hide{display:none}
.step{max-width:560px;margin:auto}
.opt{display:block;border:2px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;background:#fff}
.opt.sel{border-color:var(--gr);background:#eafaf3}
.dots{display:flex;gap:6px;margin-bottom:12px}.dots span{flex:1;height:6px;border-radius:3px;background:var(--bd)}.dots .d{background:var(--gr)}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}
.priv{background:#eaf3ff;border:1px solid #b9d3f2;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:10px}
@media(max-width:800px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px}nav .logo,nav h1{width:100%}nav button.m{width:auto;padding:8px}main{padding:12px}}
[dir=rtl] #orgFr{display:none}
[dir=rtl] nav button.m.on{box-shadow:inset -3px 0 var(--gr)}
</style>
</head>

  <h1 id="orgFr">Syndicat Mauritanien des Retraités de la Santé</h1>
  <div class="ar" dir="rtl">الاتحادية الموريتانية لمتقاعدي الصحة</div>
  <div id="menu"></div>
  <button class="lang" id="langBtn">العربية / Français</button>
</nav>
<main>
  <p class="slogan" id="slogan">معاً من أجل حقوقنا وصحتنا وكرامتنا</p>
  <div id="view"></div>
</main>

<script>
/* ============================================================
   DONNÉES
   Collez la liste ici (une ligne par adhérent) OU utilisez le module « Import ».
   Format conseillé (séparateur tabulation ou ;) :  N° ; Nom et prénom ; Grade ; Téléphone
   ============================================================ */
const RAW_LIST = ``;

/* ===== Textes FR / AR ===== */
const T = {
 fr:{dash:"Tableau de bord",mem:"Adhérents",ver:"Vérification",vote:"Vote (démo)",res:"Résultats (démo)",cong:"Congrès",imp:"Import / Données",guide:"Guide pratique"},
 ar:{dash:"لوحة القيادة",mem:"المنخرطون",ver:"التحقق",vote:"التصويت (تجريبي)",res:"النتائج (تجريبية)",cong:"المؤتمر",imp:"استيراد / بيانات",guide:"الدليل العملي"}
};
let lang=localStorage.getItem('smrs_lang')||'fr', page='dash';
const KEY='smrs_state';
let S = JSON.parse(localStorage.getItem(KEY)||'null') || {raw:RAW_LIST, edits:{}, tasks:null, ballots:[]};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== Analyse de la liste (aucune correction automatique) ===== */
function parse(raw){
  return raw.split(/\r?\n/).filter(l=>l.trim()).map((l,i)=>{
    let n='',name='',grade='',phone='';
    const cols=l.split(/\t|;/).map(c=>c.trim());
    if(cols.length>=3){ // colonnes explicites
      if(cols.length>=4){[n,name,grade,phone]=cols;} else {[n,name,phone]=cols;}
    } else { // heuristique : numéro au début, téléphone à la fin
      let t=l.trim(); let m=t.match(/^(\d+)[\s.\-)]+/); if(m){n=m[1];t=t.slice(m[0].length);}
      m=t.match(/(\+?\d[\d\s]{6,})\s*$/); if(m){phone=m[1].trim();t=t.slice(0,m.index);}
      name=t.trim();
    }
    return {id:i+1,n,name,grade,phone,orig:l};
  });
}
let M=[];
function build(){
  M=parse(S.raw);
  const cn={},cp={};
  M.forEach(m=>{const k=m.name.toLowerCase().replace(/\s+/g,' ');if(k)cn[k]=(cn[k]||0)+1;const p=m.phone.replace(/\D/g,'');if(p)cp[p]=(cp[p]||0)+1;});
  M.forEach(m=>{
    const e=S.edits[m.id]||{}; m.status=e.status||'À vérifier'; m.obs=e.obs||''; m.corr=e.corr||'';
    const f=[],k=m.name.toLowerCase().replace(/\s+/g,' '),p=m.phone.replace(/\D/g,'');
    if(!m.name)f.push(['Nom manquant']); if(!m.phone)f.push(['Contact manquant']);
    if(!m.grade)f.push(['Grade non renseigné','w']);
    if((k&&cn[k]>1)||(p&&cp[p]>1))f.push(['Doublon potentiel']);
    if((m.name&&/\d/.test(m.name))||(p&&(p.length<8||p.length>12)))f.push(['Format inhabituel','w']);
    m.flags=f; m.dup=f.some(x=>x[0]==='Doublon potentiel');
  });
}
const mask=p=>S.mask&&p?p.replace(/\d(?=[\d\s]*\d{2}$)/g,'•'):p;

/* ===== Menu ===== */
function menu(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('#menu').innerHTML=Object.keys(T.fr).map(k=>`<button class="m ${k===page?'on':''}" onclick="go('${k}')">${T[lang][k]}</button>`).join('');
}
function go(p){page=p;menu();render();window.scrollTo(0,0)}
$('#langBtn').onclick=()=>{lang=lang==='fr'?'ar':'fr';localStorage.setItem('smrs_lang',lang);menu();render()};

/* ===== Rendu ===== */
function render(){build();({dash,mem,ver,vote,res,cong,imp,guide})[page]();}
const empty=()=>M.length===0?`<div class="card">Aucune donnée : allez dans <b>Import / Données</b> pour coller ou charger la liste des adhérents.</div>`:'';

/* --- Tableau de bord --- */
function dash(){
  const tot=M.length, named=M.filter(m=>m.name).length, ct=M.filter(m=>m.phone).length;
  const conf=M.filter(m=>m.status==='Confirmé').length, ver=M.filter(m=>m.status==='À vérifier').length, cor=M.filter(m=>m.status==='À corriger').length;
  const st=[['Lignes reçues',tot],['Noms identifiables',named],['Contacts renseignés',ct],['Contacts manquants',tot-ct],['Doublons potentiels',M.filter(m=>m.dup).length],['Adhérents confirmés',conf],['Adhérents à vérifier',ver]];
  const bar=(l,v,t)=>`<div class="bar"><span class="l">${l}</span><i style="width:${t?v/t*60:0}%"></i><b>${v}</b></div>`;
  $('#view').innerHTML=`<h2>${T[lang].dash}</h2>${empty()}
  <div class="grid">${st.map(s=>`<div class="card stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
   <div class="card"><b>Qualité des contacts</b>${bar('Renseignés',ct,tot)}${bar('Manquants',tot-ct,tot)}</div>
   <div class="card"><b>Avancement de la vérification</b>${bar('Confirmés',conf,tot)}${bar('À vérifier',ver,tot)}${bar('À corriger',cor,tot)}</div>
   <div class="card"><b>Préparation du congrès</b>${bar('Tâches faites',taskDone(),taskList().length)}</div></div>
  <p style="color:var(--mu);font-size:13px">Tous les chiffres sont calculés à partir de la liste chargée.</p>`;
}

/* --- Adhérents --- */
let q={s:'',g:'',sort:'',page:0,per:20,dir:1};
function filtered(){
  let r=M.filter(m=>(!q.s||m.name.toLowerCase().includes(q.s.toLowerCase())||m.phone.replace(/\s/g,'').includes(q.s.replace(/\s/g,'')))&&(!q.g||m.grade===q.g));
  if(q.sort)r=[...r].sort((a,b)=>String(a[q.sort]).localeCompare(String(b[q.sort]),'fr')*q.dir);
  return r;
}
function mem(){
  const grades=[...new Set(M.map(m=>m.grade).filter(Boolean))].sort();
  $('#view').innerHTML=`<h2>${T[lang].mem}</h2>${empty()}
  <div class="priv">🔒 Données personnelles : consultation interne uniquement. Ne jamais publier les numéros.</div>
  <div class="tools"><input id="qs" placeholder="Nom ou téléphone…" value="${esc(q.s)}">
   <select id="qg"><option value="">Tous les grades</option>${grades.map(g=>`<option ${g===q.g?'selected':''}>${esc(g)}</option>`).join('')}</select>
   <button class="b o" onclick="sortBy('name')">Tri A→Z / Z→A</button>
   <button class="b o" onclick="S.mask=!S.mask;save();mem()">${S.mask?'Afficher':'Masquer'} les numéros</button>
   <button class="b g" onclick="csv()">Exporter CSV</button></div>
  <div id="tb"></div>`;
  $('#qs').oninput=e=>{q.s=e.target.value;q.page=0;tbl()};
  $('#qg').onchange=e=>{q.g=e.target.value;q.page=0;tbl()};
  tbl();
}
function sortBy(k){q.dir=q.sort===k?-q.dir:1;q.sort=k;tbl()}
function tbl(){
  const r=filtered(), pages=Math.max(1,Math.ceil(r.length/q.per)); q.page=Math.min(q.page,pages-1);
  const rows=r.slice(q.page*q.per,(q.page+1)*q.per);
  $('#tb').innerHTML=`<div>${r.length} résultat(s)</div><div class="tw"><table><tr><th>N°</th><th onclick="sortBy('name')">Nom et prénom</th><th onclick="sortBy('grade')">Grade</th><th>Contact</th></tr>
  ${rows.map(m=>`<tr><td>${esc(m.n)}</td><td>${esc(m.name)}</td><td>${esc(m.grade)}</td><td>${esc(mask(m.phone))}</td></tr>`).join('')}</table></div>
  <div class="pg"><button class="b o" ${q.page?'':'disabled'} onclick="q.page--;tbl()">◀</button>Page ${q.page+1}/${pages}<button class="b o" ${q.page<pages-1?'':'disabled'} onclick="q.page++;tbl()">▶</button></div>`;
}
function csv(){
  const rows=[['N','Nom','Grade','Telephone','Statut','Observation']].concat(filtered().map(m=>[m.n,m.name,m.grade,m.phone,m.status,m.obs]));
  const t='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='adherents.csv';a.click();
}

/* --- Vérification --- */
let vq={f:'',s:'',page:0};
function ver(){
  $('#view').innerHTML=`<h2>${T[lang].ver}</h2>${empty()}
  <div class="priv">Les données d'origine ne sont jamais modifiées : les corrections proposées sont stockées à part.</div>
  <div class="tools"><select id="vf"><option value="">Toutes les anomalies</option>${['Nom manquant','Contact manquant','Doublon potentiel','Grade non renseigné','Format inhabituel'].map(x=>`<option ${vq.f===x?'selected':''}>${x}</option>`).join('')}</select>
  <select id="vs"><option value="">Tous les statuts</option>${['À vérifier','Confirmé','À corriger'].map(x=>`<option ${vq.s===x?'selected':''}>${x}</option>`).join('')}</select></div><div id="vt"></div>`;
  $('#vf').onchange=e=>{vq.f=e.target.value;vq.page=0;vt()};$('#vs').onchange=e=>{vq.s=e.target.value;vq.page=0;vt()};vt();
}
function vt(){
  const r=M.filter(m=>(!vq.f||m.flags.some(f=>f[0]===vq.f))&&(!vq.s||m.status===vq.s)), pages=Math.max(1,Math.ceil(r.length/15));
  vq.page=Math.min(vq.page,pages-1);

/* ===== Lecture d'un fichier Word (.docx) sans bibliothèque externe =====
   Un .docx est une archive ZIP : on extrait word/document.xml puis on lit les tableaux. */
async function readDocx(file){
  const buf=new Uint8Array(await file.arrayBuffer()), dv=new DataView(buf.buffer);
  let e=buf.length-22; while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error("ce n'est pas un fichier .docx valide");
  const cnt=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true), xml=null;
  for(let i=0;i<cnt;i++){
    const meth=dv.getUint16(p+10,true), cs=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lh=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(buf.subarray(p+46,p+46+nl));
    if(name==='word/document.xml'){
      const st=lh+30+dv.getUint16(lh+26,true)+dv.getUint16(lh+28,true), data=buf.subarray(st,st+cs);
      xml=meth===0?new TextDecoder().decode(data):await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
      break;
    }
    p+=46+nl+xl+cl;
  }
  if(!xml)throw new Error('document.xml introuvable');
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const txt=el=>[...el.getElementsByTagName('*')].filter(n=>n.localName==='t'||n.localName==='tab').map(n=>n.localName==='tab'?' ':n.textContent).join('').replace(/\s+/g,' ').trim();
  const out=[], tbls=[...doc.getElementsByTagName('w:tbl')];
  if(tbls.length){
    tbls.forEach(t=>[...t.getElementsByTagName('w:tr')].forEach((r,ri)=>{
      const cells=[...r.getElementsByTagName('w:tc')].map(c=>[...c.getElementsByTagName('w:p')].map(txt).filter(Boolean).join(' '));
      if(!cells.some(c=>c))return;
      if(ri===0&&!cells.some(c=>/\d/.test(c)))return; // ligne d'en-tête
      out.push(cells.join(';'));
    }));
  } else { // pas de tableau : un paragraphe = une ligne
    [...doc.getElementsByTagName('w:p')].map(txt).filter(Boolean).forEach(l=>out.push(l));
  }
  if(!out.length)throw new Error('aucune ligne trouvée');
  return out.join('\n');
}

"Collez ici la liste (une ligne par adhérent). Format idéal :":"الصق القائمة هنا (سطر لكل منخرط). الصيغة المثلى:",
"N° ; Nom ; Grade ; Téléphone":"الرقم ; الاسم ; الرتبة ; الهاتف",
"(séparés par ; ou tabulation). Sans séparateur, le numéro est lu au début et le téléphone à la fin de la ligne. Les téléphones restent du texte.":"(مفصولة بـ ; أو بعلامة جدولة). دون فواصل يُقرأ الرقم في بداية السطر والهاتف في نهايته. تبقى أرقام الهاتف نصوصًا.",
"Charger la liste":"تحميل القائمة",
"Fichier Word (.docx) : le tableau est lu automatiquement (colonnes : N°, Nom, Grade, Téléphone). Le format ancien .doc doit d'abord être enregistré en .docx.":"ملف Word (‎.docx‎): يُقرأ الجدول تلقائيًا (الأعمدة: الرقم، الاسم، الرتبة، الهاتف). صيغة ‎.doc‎ القديمة يجب حفظها أولًا بصيغة ‎.docx‎.",
"Réinitialiser":"إعادة الضبط",
"Efface les statuts, observations, tâches et bulletins simulés enregistrés dans ce navigateur (et la liste importée).":"تمسح الحالات والملاحظات والمهام وأوراق التصويت التجريبية المحفوظة في هذا المتصفح (والقائمة المستوردة).",
"Réinitialiser la démonstration":"إعادة ضبط العرض التجريبي"
};
const RX=[
[/^(\d+) résultat\(s\)$/,m=>m[1]+' نتيجة'],
[/^(\d+) ligne\(s\)$/,m=>m[1]+' سطر'],
[/^Page (\d+)\/(\d+)$/,m=>'صفحة '+m[1]+'/'+m[2]],
[/^Numéro trouvé dans la liste chargée : (.*)$/,m=>'الرقم موجود في القائمة المحمّلة: '+m[1]],
[/^([◉○]) (.+)$/,m=>m[1]+' '+(AR[m[2]]||m[2])],
[/^Participation simulée \(base fictive de (\d+)\)$/,m=>'نسبة المشاركة (محاكاة، على أساس وهمي من '+m[1]+')'],
[/^Base fictive \+ (\d+) bulletin\(s\) simulé\(s\) dans ce navigateur\.$/,m=>'أساس وهمي + '+m[1]+' ورقة تصويت تجريبية في هذا المتصفح.'],
[/^Invitations : (\d+) adhérents dans la liste \(à valider\)$/,m=>'الدعوات: '+m[1]+' منخرطًا في القائمة (للاعتماد)'],
[/^Adhérents confirmés : (\d+)$/,m=>'منخرطون مؤكَّدون: '+m[1]],
[/^À vérifier : (\d+)$/,m=>'للتحقق: '+m[1]],
[/^(\d+) ligne\(s\) lue\(s\) — vérifiez puis cliquez « Charger la liste »\.$/,m=>m[1]+' سطر مقروء — راجعها ثم اضغط «تحميل القائمة».'],
[/^Lecture impossible : (.*)$/,m=>'تعذّرت القراءة: '+m[1]]
];
function tr(s){
  const k=s.trim(); if(!k)return s;
  let r=AR[k];
  if(r===undefined)for(const [re,f] of RX){const m=k.match(re);if(m){r=f(m);break}}
  return r===undefined?s:s.replace(k,()=>r);
}
/* Applique la traduction au contenu affiché (appelé automatiquement après chaque affichage) */
function applyLang(){
  document.title=lang==='ar'?'الاتحادية الموريتانية لمتقاعدي الصحة — المؤتمر':'SMRS — Prototype congrès';
  // slogan : français en mode FR, arabe en mode AR (modifié seulement s'il change, pour éviter une boucle)
  const sl=document.getElementById('slogan'),st=lang==='ar'?'معاً من أجل حقوقنا وصحتنا وكرامتنا':'Ensemble pour nos droits, notre santé et notre dignité';
  if(sl.textContent!==st)sl.textContent=st;
  if(lang!=='ar')return;
  const el=document.querySelector('main');
  // les options gardent leur valeur d'origine (française) : le code interne ne change pas
  el.querySelectorAll('option:not([value])').forEach(o=>o.setAttribute('value',o.textContent));
  el.querySelectorAll('[placeholder]').forEach(i=>{const v=i.getAttribute('placeholder'),t=tr(v);if(t!==v)i.setAttribute('placeholder',t)});
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),L=[];let n;
  while(n=w.nextNode()){const p=n.parentNode.nodeName;if(p!=='TEXTAREA'&&p!=='SCRIPT'&&p!=='STYLE')L.push(n)}
  L.forEach(n=>{const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t});
}
new MutationObserver(applyLang).observe(document.querySelector('main'),{childList:true,subtree:true,characterData:true});

menu();render();applyLang();
</script>
